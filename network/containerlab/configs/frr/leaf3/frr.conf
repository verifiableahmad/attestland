frr defaults datacenter
hostname leaf3
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.1.3/32
exit
!
interface eth3
 ip address 10.1.1.5/31
exit
!
interface eth4
 ip address 10.1.2.5/31
exit
!
bfd
 profile fast
  transmit-interval 100
  receive-interval 100
  detect-multiplier 3
 exit
exit
!
vrf vrf-red
 vni 10100
exit-vrf
!
vrf vrf-blue
 vni 20100
exit-vrf
!
router bgp 65103
 bgp router-id 10.0.1.3
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor SPINES peer-group
 neighbor SPINES remote-as external
 neighbor SPINES bfd profile fast
 neighbor SPINES timers 3 9
 neighbor SPINES timers connect 2
 neighbor 10.1.1.4 peer-group SPINES
 neighbor 10.1.2.4 peer-group SPINES
 !
 address-family ipv4 unicast
  network 10.0.1.3/32
  neighbor SPINES activate
  maximum-paths 8
 exit-address-family
 address-family l2vpn evpn
  neighbor SPINES activate
  advertise-all-vni
  vni 10010
   route-target import 65500:10010
   route-target export 65500:10010
  exit-vni
  vni 20010
   route-target import 65500:20010
   route-target export 65500:20010
  exit-vni
 exit-address-family
exit
!
router bgp 65103 vrf vrf-red
 bgp router-id 10.0.1.3
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65500:10100
  route-target export 65500:10100
 exit-address-family
exit
!
router bgp 65103 vrf vrf-blue
 bgp router-id 10.0.1.3
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65500:20100
  route-target export 65500:20100
 exit-address-family
exit
!
