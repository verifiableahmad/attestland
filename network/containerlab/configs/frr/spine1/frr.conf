frr defaults datacenter
hostname spine1
log stdout informational
service integrated-vtysh-config
!
bfd
 profile fast
  transmit-interval 100
  receive-interval 100
  detect-multiplier 3
 exit
exit
!
interface lo
 ip address 10.0.0.1/32
exit
!
interface eth1
 ip address 10.1.1.0/31
exit
!
interface eth2
 ip address 10.1.1.2/31
exit
!
interface eth3
 ip address 10.1.1.4/31
exit
!
interface eth4
 ip address 10.1.1.6/31
exit
!
router bgp 65100
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor LEAVES peer-group
 neighbor LEAVES remote-as external
 neighbor LEAVES bfd profile fast
 neighbor LEAVES timers 3 9
 neighbor LEAVES timers connect 2
 neighbor 10.1.1.1 peer-group LEAVES
 neighbor 10.1.1.3 peer-group LEAVES
 neighbor 10.1.1.5 peer-group LEAVES
 neighbor 10.1.1.7 peer-group LEAVES
 !
 address-family ipv4 unicast
  network 10.0.0.1/32
  neighbor LEAVES activate
  maximum-paths 8
 exit-address-family
 address-family l2vpn evpn
  neighbor LEAVES activate
  neighbor LEAVES attribute-unchanged next-hop
 exit-address-family
exit
!
