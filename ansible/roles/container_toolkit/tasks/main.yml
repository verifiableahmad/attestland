- name: NVIDIA container toolkit repo
  ansible.builtin.shell: |
    curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    curl -fsSL https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list \
      | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' \
      > /etc/apt/sources.list.d/nvidia-container-toolkit.list
  args:
    creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list

- name: Install pinned toolkit
  ansible.builtin.apt:
    name:
      - "nvidia-container-toolkit={{ nvidia_container_toolkit_version }}-1"
      - "nvidia-container-toolkit-base={{ nvidia_container_toolkit_version }}-1"
      - "libnvidia-container-tools={{ nvidia_container_toolkit_version }}-1"
      - "libnvidia-container1={{ nvidia_container_toolkit_version }}-1"
    update_cache: true

- name: CDI spec for podman (regenerated at boot by nvidia-cdi-refresh)
  ansible.builtin.command: nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
  changed_when: true
