# Periodic short diag (spec 1.3 input): dcgmi diag -r 1 every 30 min -> textfile metrics.
- name: Periodic diag script
  ansible.builtin.copy:
    src: periodic-diag.sh
    dest: /opt/al/bin/periodic-diag
    mode: "0755"

- name: Periodic diag units
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - name: al-periodic-diag.service
      content: |
        [Unit]
        Description=Short DCGM diagnostic for healthd
        [Service]
        Type=oneshot
        ExecStart=/opt/al/bin/periodic-diag
    - name: al-periodic-diag.timer
      content: |
        [Unit]
        Description=Run the short DCGM diagnostic every 30 minutes
        [Timer]
        OnBootSec=5min
        OnUnitActiveSec=30min
        RandomizedDelaySec=60
        [Install]
        WantedBy=timers.target

- name: Timer enabled
  ansible.builtin.systemd:
    name: al-periodic-diag.timer
    enabled: true
    state: started
    daemon_reload: true
