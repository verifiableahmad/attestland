- name: Kernel modules for containerd networking
  community.general.modprobe:
    name: "{{ item }}"
    persistent: present
  loop: [overlay, br_netfilter]

- name: Bridge netfilter and forwarding
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/91-k8s.conf
  loop: [net.bridge.bridge-nf-call-iptables, net.bridge.bridge-nf-call-ip6tables, net.ipv4.ip_forward]

# Ubuntu's podman puts its bridge network in /etc/cni/net.d, kubelet's CNI
# directory. Pods that start before Calico writes its config (CoreDNS on the
# control node) then land on that host-only bridge, and pods on other nodes cannot
# reach them: DNS from the GPU nodes times out (I-16, "Could not connect to the
# endpoint URL"). podman keeps its networks in a directory of its own.
- name: podman's CNI directory
  ansible.builtin.file:
    path: /etc/containers/cni.d
    state: directory
    mode: "0755"

- name: podman reads its networks from there
  community.general.ini_file:
    path: /etc/containers/containers.conf
    section: network
    option: network_config_dir
    value: '"/etc/containers/cni.d"'
    mode: "0644"

- name: podman's bridge out of kubelet's CNI directory
  ansible.builtin.shell: |
    shopt -s nullglob
    moved=0
    for f in /etc/cni/net.d/*podman*.conflist; do mv "$f" /etc/containers/cni.d/; moved=1; done
    echo "moved=$moved"
  args:
    executable: /bin/bash
  register: al_podman_cni
  changed_when: "'moved=1' in al_podman_cni.stdout"

- name: Swap off
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Kubernetes apt repo (minor version pinned)
  ansible.builtin.shell: |
    v={{ kubernetes_version.split('.')[:2] | join('.') }}
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v$v/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v$v/deb/ /" > /etc/apt/sources.list.d/kubernetes.list
  args:
    creates: /etc/apt/sources.list.d/kubernetes.list

- name: containerd, kubelet, kubeadm, kubectl
  ansible.builtin.apt:
    name:
      - containerd
      - "kubelet={{ kubernetes_version }}-1.1"
      - "kubeadm={{ kubernetes_version }}-1.1"
      - "kubectl={{ kubernetes_version }}-1.1"
    update_cache: true

- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]

- name: containerd config with systemd cgroups
  ansible.builtin.shell: |
    mkdir -p /etc/containerd
    containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/' > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml
  register: ctd

- name: NVIDIA runtime in containerd (host toolkit; GPU Operator toolkit disabled)
  ansible.builtin.shell: |
    grep -q 'runtimes.nvidia\]' /etc/containerd/config.toml && { echo present; exit 0; }
    nvidia-ctk runtime configure --runtime=containerd --set-as-default=false --cdi.enabled
  when: "'gpu' in group_names"
  register: al_ctk
  changed_when: "'present' not in al_ctk.stdout"

# Restarted only when its configuration changed: every restart restarts the
# pods' containers on this node (OPS-1).
- name: containerd running
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: "{{ 'restarted' if ctd.changed or (al_ctk.changed | default(false)) else 'started' }}"
