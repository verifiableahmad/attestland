- name: MariaDB for slurmdbd
  ansible.builtin.apt:
    name: [mariadb-server, python3-pymysql]

- name: Accounting database and user
  community.mysql.mysql_user:
    name: slurm
    password: "{{ slurmdbd_db_password }}"
    priv: "slurm_acct_db.*:ALL"
    login_unix_socket: /run/mysqld/mysqld.sock
  no_log: true

- name: slurmdbd.conf
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../sched/slurm/slurmdbd.conf.j2"
    dest: /etc/slurm/slurmdbd.conf
    owner: "{{ slurm_user }}"
    mode: "0600"
  register: slurmdbd_conf

- name: slurmrestd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/slurmrestd.service.d
    state: directory
    mode: "0755"

# On the private address only: healthd (a pod on this node) is its one client,
# and every node and pod in the VPC could reach 0.0.0.0 (SEC-3).
- name: slurmrestd unit override (JWT, port 6820)
  ansible.builtin.copy:
    dest: /etc/systemd/system/slurmrestd.service.d/override.conf
    content: |
      [Service]
      User=nobody
      Group=nogroup
      Environment=SLURM_JWT=daemon
      ExecStart=
      ExecStart=/usr/sbin/slurmrestd -a rest_auth/jwt {{ private_ip }}:6820
    mode: "0644"
  register: slurmrestd_unit

# Restarted only when their configuration or binaries changed: a restart of
# slurmctld during `make configure` is a restart under running jobs (OPS-1).
- name: Controller daemons
  ansible.builtin.systemd:
    name: "{{ item.name }}"
    enabled: true
    state: "{{ 'restarted' if item.changed else 'started' }}"
    daemon_reload: true
  loop:
    - {name: slurmdbd, changed: "{{ slurmdbd_conf.changed or (slurm_build_changed | default(false)) }}"}
    - name: slurmctld
      changed: "{{ (slurm_conf.changed | default(false)) or (slurm_jwt.changed | default(false)) or (munge_key.changed | default(false))
                   or (slurm_build_changed | default(false)) }}"
    - name: slurmrestd
      changed: "{{ slurmrestd_unit.changed or (slurm_jwt.changed | default(false)) or (slurm_build_changed | default(false)) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Register cluster in accounting
  ansible.builtin.shell: sacctmgr -i add cluster {{ cluster_name }} || true
  changed_when: false

- name: fleet-label helper (burn-in verdict -> both schedulers)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../fleet/burnin/fleet-label"
    dest: /opt/al/bin/fleet-label
    mode: "0755"

- name: pool-move command
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../sched/pool-move.sh"
    dest: /opt/al/bin/pool-move
    mode: "0755"
