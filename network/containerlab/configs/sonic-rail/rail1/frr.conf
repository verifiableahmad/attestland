bfd
 profile fast
  transmit-interval 100
  receive-interval 100
  detect-multiplier 3
 exit
exit
!
router bgp 65201
 bgp router-id 10.10.1.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor SPINES peer-group
 neighbor SPINES remote-as external
 neighbor SPINES bfd profile fast
 neighbor SPINES timers 3 9
 neighbor SPINES timers connect 2
 neighbor 10.11.1.0 peer-group SPINES
 neighbor 10.11.2.0 peer-group SPINES
 !
 address-family ipv4 unicast
  network 10.10.1.1/32
  network 10.12.1.0/31
  network 10.12.1.2/31
  neighbor SPINES activate
  maximum-paths 8
 exit-address-family
exit
!
