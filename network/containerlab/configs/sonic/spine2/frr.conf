bfd
 profile fast
  transmit-interval 100
  receive-interval 100
  detect-multiplier 3
 exit
exit
!
router bgp 65100
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor LEAVES peer-group
 neighbor LEAVES remote-as external
 neighbor LEAVES bfd profile fast
 neighbor LEAVES timers 3 9
 neighbor LEAVES timers connect 2
 neighbor 10.1.2.1 peer-group LEAVES
 neighbor 10.1.2.3 peer-group LEAVES
 neighbor 10.1.2.5 peer-group LEAVES
 neighbor 10.1.2.7 peer-group LEAVES
 !
 address-family ipv4 unicast
  network 10.0.0.2/32
  neighbor LEAVES activate
  maximum-paths 8
 exit-address-family
 address-family l2vpn evpn
  neighbor LEAVES activate
  neighbor LEAVES attribute-unchanged next-hop
 exit-address-family
exit
!
