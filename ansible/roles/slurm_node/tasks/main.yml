# slurmd loads topology/tree from its local slurm.conf, so it needs the file the
# topology role generated on the control VM.
- name: topology.conf as generated on the controller
  ansible.builtin.slurp:
    src: /etc/slurm/topology.conf
  delegate_to: "{{ groups['control'][0] }}"
  run_once: true
  register: al_topology_src

- name: topology.conf matches the controller
  ansible.builtin.copy:
    content: "{{ al_topology_src.content | b64decode }}"
    dest: /etc/slurm/topology.conf
    mode: "0644"
  register: al_topology_node

- name: slurmd running
  ansible.builtin.systemd:
    name: slurmd
    enabled: true
    state: "{{ 'restarted' if (slurm_conf.changed | default(false)) or al_topology_node.changed else 'started' }}"
    daemon_reload: true

- name: Enroot config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../sched/slurm/enroot.conf"
    dest: /etc/enroot/enroot.conf
    mode: "0644"

# enroot.conf puts ENROOT_RUNTIME_PATH under /run/enroot, and enroot creates only
# the per-user directory, as the job's user. /run is a tmpfs: recreate it at boot.
- name: Enroot runtime directory at boot
  ansible.builtin.copy:
    content: "d /run/enroot 1777 root root -\n"
    dest: /etc/tmpfiles.d/enroot.conf
    mode: "0644"

- name: Enroot runtime directory now
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/enroot.conf
  args:
    creates: /run/enroot
