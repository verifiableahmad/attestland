# AWS CLI v2 on the control VM: chaos node-loss (ec2 stop/start) and the
# topology lookup (ec2 describe-instance-topology) use it with the node role.
# Same version as AWSCLI_IMAGE in versions.env.
- name: unzip
  ansible.builtin.apt:
    name: unzip

- name: AWS CLI v2 zip (checksum in versions.env)
  ansible.builtin.get_url:
    url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-{{ awscli_image.split(':')[1] }}.zip"
    dest: "/opt/al/dl/awscli-{{ awscli_image.split(':')[1] }}.zip"
    checksum: "sha256:{{ awscli_sha256 }}"
    mode: "0644"

- name: Install AWS CLI v2
  ansible.builtin.shell: |
    set -euo pipefail
    rm -rf /tmp/aws && unzip -q /opt/al/dl/awscli-{{ awscli_image.split(':')[1] }}.zip -d /tmp
    /tmp/aws/install --update
    rm -rf /tmp/aws
  args:
    executable: /bin/bash
    creates: /usr/local/bin/aws

- name: Default region for the CLI
  ansible.builtin.copy:
    dest: /etc/profile.d/al-aws.sh
    mode: "0644"
    content: |
      export AWS_REGION={{ al_region }} AWS_DEFAULT_REGION={{ al_region }}
