# registry.k8s.io sometimes answers 429 to EC2 addresses; retry here so kubeadm init finds the images cached.
- name: Control-plane images
  ansible.builtin.command: kubeadm config images pull --kubernetes-version v{{ kubernetes_version }}
  args:
    creates: /etc/kubernetes/admin.conf
  register: k8s_images
  retries: 5
  delay: 20
  until: k8s_images.rc == 0

- name: kubeadm init
  ansible.builtin.command: >-
    kubeadm init
    --kubernetes-version v{{ kubernetes_version }}
    --pod-network-cidr {{ k8s_pod_cidr }}
    --service-cidr {{ k8s_service_cidr }}
    --apiserver-advertise-address {{ private_ip }}
    --apiserver-cert-extra-sans {{ ansible_host }}
  args:
    creates: /etc/kubernetes/admin.conf

- name: kubeconfig directory for root
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0700"

- name: kubeconfig for root
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    mode: "0600"

- name: kubeconfig directory for the login user
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: kubeconfig for the login user (kubectl on the control node without sudo)
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Calico manifest (checksum in versions.env)
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml
    dest: /opt/al/dl/calico-{{ calico_version }}.yaml
    checksum: "sha256:{{ calico_manifest_sha256 }}"
    mode: "0644"

- name: Calico CNI
  ansible.builtin.command: kubectl apply -f /opt/al/dl/calico-{{ calico_version }}.yaml
  register: al_calico
  changed_when: "'configured' in al_calico.stdout or 'created' in al_calico.stdout"

# Pods created before Calico was ready (or on a cluster built before podman's
# bridge was moved) keep a host-only address: recreate those in kube-system.
- name: kube-system pods on the pod network
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl -n kube-system rollout status ds/calico-node --timeout=10m >/dev/null
    for d in coredns calico-kube-controllers; do
      ips=$(kubectl -n kube-system get pods -l "k8s-app=${d/coredns/kube-dns}" -o jsonpath='{.items[*].status.podIP}')
      if python3 -c 'import ipaddress,sys; n=ipaddress.ip_network(sys.argv[1]); sys.exit(0 if all(ipaddress.ip_address(i) in n for i in sys.argv[2:]) else 1)' \
          {{ k8s_pod_cidr }} $ips; then continue; fi
      echo "recreating $d (pod IPs: $ips)"
      kubectl -n kube-system rollout restart deploy/$d
      kubectl -n kube-system rollout status deploy/$d --timeout=5m >/dev/null
    done
  args:
    executable: /bin/bash
  register: al_kube_system_net
  changed_when: "'recreating' in al_kube_system_net.stdout"

- name: Join command for workers
  ansible.builtin.command: kubeadm token create --print-join-command --ttl 1h
  register: join_cmd
  changed_when: false

- name: Share join command
  ansible.builtin.set_fact:
    k8s_join_command: "{{ join_cmd.stdout }}"

- name: Fetch kubeconfig for the operator laptop
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ playbook_dir }}/../secrets/kubeconfig-{{ al_cloud }}"
    flat: true

# admin.conf names the private address, which the laptop cannot reach; the API
# certificate also carries the public one (--apiserver-cert-extra-sans) (I-10).
- name: Laptop kubeconfig points at the public address
  delegate_to: localhost
  become: false
  ansible.builtin.replace:
    path: "{{ playbook_dir }}/../secrets/kubeconfig-{{ al_cloud }}"
    regexp: 'server: https://[^:]+:6443'
    replace: "server: https://{{ ansible_host }}:6443"
