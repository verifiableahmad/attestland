# Imported images and unpacked containers on local NVMe (spec 3.1).
ENROOT_RUNTIME_PATH        /run/enroot/user-$(id -u)
ENROOT_CACHE_PATH          /scratch/enroot/cache
ENROOT_DATA_PATH           /scratch/enroot/data
ENROOT_TEMP_PATH           /scratch/enroot/tmp
ENROOT_SQUASH_OPTIONS      -noI -noD -noF -noX -no-duplicates
ENROOT_MOUNT_HOME          no
ENROOT_RESTRICT_DEV        yes
ENROOT_ROOTFS_WRITABLE     yes
