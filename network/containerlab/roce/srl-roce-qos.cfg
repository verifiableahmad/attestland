# SR Linux lossless RoCEv2 class (hardware only; NOT validated on a release).
# Apply on every backend leaf and spine port. Check every path against the
# target release's YANG before use: QoS paths vary across SR Linux versions.

# DSCP -> forwarding class
set / qos classifiers dscp-policy roce dscp 26 forwarding-class fc3
set / qos classifiers dscp-policy roce dscp 48 forwarding-class fc6
set / qos classifiers dscp-policy roce dscp 0..25 forwarding-class fc0
set / qos classifiers dscp-policy roce dscp 27..47 forwarding-class fc0
set / qos classifiers dscp-policy roce dscp 49..63 forwarding-class fc0

# Forwarding class -> output queue
set / qos forwarding-classes forwarding-class fc3 output unicast-queue queue-3
set / qos forwarding-classes forwarding-class fc6 output unicast-queue queue-6
set / qos forwarding-classes forwarding-class fc0 output unicast-queue queue-0

# Lossless: PFC on priority 3 with a 200 ms watchdog
set / qos pfc-mapping-table pfc-roce pfc-priority 3 forwarding-class fc3
set / qos pfc-watchdog admin-state enable
set / qos pfc-watchdog detection-interval 200
set / qos pfc-watchdog recovery-interval 400

# ECN marking on queue 3: Kmin 150 KB, Kmax 1500 KB, Pmax 10%
set / qos queue-management-profile roce-ecn wred slope enable-ecn true
set / qos queue-management-profile roce-ecn wred slope traffic-type tcp drop-probability all slope-enabled true
set / qos queue-management-profile roce-ecn wred slope traffic-type tcp drop-probability all min-threshold-bytes 153600
set / qos queue-management-profile roce-ecn wred slope traffic-type tcp drop-probability all max-threshold-bytes 1536000
set / qos queue-management-profile roce-ecn wred slope traffic-type tcp drop-probability all max-probability 10
set / qos queue-management-profile roce-ecn wred slope traffic-type non-tcp drop-probability all slope-enabled true
set / qos queue-management-profile roce-ecn wred slope traffic-type non-tcp drop-probability all min-threshold-bytes 153600
set / qos queue-management-profile roce-ecn wred slope traffic-type non-tcp drop-probability all max-threshold-bytes 1536000
set / qos queue-management-profile roce-ecn wred slope traffic-type non-tcp drop-probability all max-probability 10

# Scheduler: CNP strict priority; data 95 / best effort 5
set / qos output-scheduler-policy roce tier 1 node 0 scheduler-input queue-6 strict-priority true
set / qos output-scheduler-policy roce tier 1 node 0 scheduler-input queue-3 weight 95
set / qos output-scheduler-policy roce tier 1 node 0 scheduler-input queue-0 weight 5

# Per-interface binding (repeat per backend port)
set / qos interfaces interface ethernet-1/1 interface-ref interface ethernet-1/1
set / qos interfaces interface ethernet-1/1 input classifiers dscp-policy roce
set / qos interfaces interface ethernet-1/1 output scheduler output-scheduler-policy roce
set / qos interfaces interface ethernet-1/1 output queues queue queue-3 queue-management-profile roce-ecn
set / qos interfaces interface ethernet-1/1 pfc pfc-enable true
set / qos interfaces interface ethernet-1/1 pfc pfc-mapping-table pfc-roce
