bfd
 profile fast
  transmit-interval 100
  receive-interval 100
  detect-multiplier 3
 exit
exit
!
router bgp 65200
 bgp router-id 10.10.0.2
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor RAILS peer-group
 neighbor RAILS remote-as external
 neighbor RAILS bfd profile fast
 neighbor RAILS timers 3 9
 neighbor RAILS timers connect 2
 neighbor 10.11.2.1 peer-group RAILS
 neighbor 10.11.2.3 peer-group RAILS
 !
 address-family ipv4 unicast
  network 10.10.0.2/32
  neighbor RAILS activate
  maximum-paths 8
 exit-address-family
exit
!
