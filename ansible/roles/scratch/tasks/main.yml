# Fast tier: local NVMe mounted at /scratch (EC2 instance store; g6.2xlarge has one 450 GB disk).
- name: Find local NVMe SSDs
  ansible.builtin.shell: |
    for d in /dev/disk/by-id/nvme-Amazon_EC2_NVMe_Instance_Storage_*; do
      [[ -e $d && $d != *-part* ]] && readlink -f "$d"
    done | sort -u
  args:
    executable: /bin/bash
  register: ssds
  changed_when: false

- name: Make filesystem
  community.general.filesystem:
    dev: "{{ ssds.stdout_lines | first }}"
    fstype: ext4
    opts: -E nodiscard -m 0
  when: ssds.stdout_lines | length > 0

- name: Mount /scratch
  ansible.posix.mount:
    path: "{{ scratch_mount }}"
    src: "{{ ssds.stdout_lines | first }}"
    fstype: ext4
    opts: defaults,noatime,nofail,discard
    state: mounted
  when: ssds.stdout_lines | length > 0

- name: Scratch layout
  ansible.builtin.file:
    path: "{{ scratch_mount }}/{{ item }}"
    state: directory
    mode: "1777"
  loop: [ckpt, enroot, logs, data]
