- name: alissue binary (built by `make receipts`)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../bin/alissue-linux-amd64"
    dest: /usr/local/bin/alissue
    mode: "0755"
- name: Verification policy and cosign
  ansible.builtin.shell: |
    curl -fsSLo /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/{{ cosign_version }}/cosign-linux-amd64
    chmod 0755 /usr/local/bin/cosign
  args:
    creates: /usr/local/bin/cosign
- name: Receipt issuer environment (run-job.sh and attest_time.sh source it)
  ansible.builtin.copy:
    dest: /etc/fleet/receipts.env
    mode: "0644"
    content: |
      AL_PLATFORM=azure
      MAA_URL={{ maa_url }}
