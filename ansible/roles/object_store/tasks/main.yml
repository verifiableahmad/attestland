# Durable tier settings (ADR 010): an env file the training scripts source.
# Buckets are created by tofu (infra/gpu-pool/storage.tf); credentials come from
# the node's instance role, so the file holds no secret.
- name: Fleet config directory
  ansible.builtin.file:
    path: /etc/fleet
    state: directory
    mode: "0755"

- name: S3 environment for jobs
  ansible.builtin.copy:
    dest: /etc/fleet/s3.env
    mode: "0644"
    content: |
      AL_S3_REGION={{ s3_region }}
      AL_BUCKET_PREFIX={{ bucket_prefix }}
