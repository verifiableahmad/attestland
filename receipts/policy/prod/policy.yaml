# Production verification policy (GCP a3-highgpu-1g: Intel TDX + H100 in CC
# mode, Google Cloud Attestation, NVIDIA NRAS). Every REPLACE value must be
# captured from the real platform before use.
cpu:
  type: tdx
  verifier: gca
  issuer: https://confidentialcomputing.googleapis.com
  jwks_file: gca-jwks.json                                # pinned copy of the jwks_uri in <issuer>/.well-known/openid-configuration
  allow_debug: false                                      # built-in checks: hwmodel=GCP_INTEL_TDX, secboot=true, dbgstat=disabled-since-boot
  require:
    aud: attestland-receipts                        # = alissue --gca-audience
    submods.gce.project_id: REPLACE-gcp-project-id        # only receipts from our project; confirm the claim on the first token
gpu:
  verifier: nras
  issuer: https://nras.attestation.nvidia.com
  jwks_file: nras-jwks.json                               # pinned copy of https://nras.attestation.nvidia.com/.well-known/jwks.json
  allowed_driver_versions: ["580.82.07"]                  # = versions.env NVIDIA_DRIVER_VERSION
  allowed_vbios_versions: []                              # REPLACE: VBIOS of the H100 in the pool
  claims:
    cc_mode: ""                                           # confirm NRAS claim for CC mode, then set
image:
  trusted_root: trusted_root.json                         # `cosign trusted-root create` / Sigstore TUF snapshot
  certificate_identity: https://github.com/REPLACE-OWNER/attestland/.github/workflows/images.yml@refs/heads/main
  certificate_oidc_issuer: https://token.actions.githubusercontent.com
  allowed_repositories: [ghcr.io/replace-owner/attestland/vllm-receipts]
