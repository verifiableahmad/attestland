bfd
 profile fast
  transmit-interval 100
  receive-interval 100
  detect-multiplier 3
 exit
exit
!
vrf Vrf-red
 vni 10100
exit-vrf
!
vrf Vrf-blue
 vni 20100
exit-vrf
!
router bgp 65102
 bgp router-id 10.0.1.2
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor SPINES peer-group
 neighbor SPINES remote-as external
 neighbor SPINES bfd profile fast
 neighbor SPINES timers 3 9
 neighbor SPINES timers connect 2
 neighbor 10.1.1.2 peer-group SPINES
 neighbor 10.1.2.2 peer-group SPINES
 !
 address-family ipv4 unicast
  network 10.0.1.2/32
  neighbor SPINES activate
  maximum-paths 8
 exit-address-family
 address-family l2vpn evpn
  neighbor SPINES activate
  advertise-all-vni
  vni 10010
   route-target import 65500:10010
   route-target export 65500:10010
  exit-vni
  vni 20010
   route-target import 65500:20010
   route-target export 65500:20010
  exit-vni
 exit-address-family
exit
!
router bgp 65102 vrf Vrf-red
 bgp router-id 10.0.1.2
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65500:10100
  route-target export 65500:10100
 exit-address-family
exit
!
router bgp 65102 vrf Vrf-blue
 bgp router-id 10.0.1.2
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65500:20100
  route-target export 65500:20100
 exit-address-family
exit
!
