# Serving sweep (spec 4.2). SLO is fixed here, before any test runs.
name: al-gpt-124m
base_url: http://al-gpu-04:30800          # vLLM NodePort on a k8s-pool node
model: al-gpt                             # --served-model-name
tokenizer: openai-community/gpt2
bench_image: vllm/vllm-openai:v0.11.0     # client runs on the control VM via podman
dataset:
  name: random
  input_len: 512
  output_len: 128
  range_ratio: 0.25                       # lengths uniform in [0.75x, 1.25x]
  seed: 42
rates: [1, 2, 4, 8, 16, 32, 64, inf]      # requests/s, light load to saturation
prompts_per_rate: 400
warmup_prompts: 50                        # discarded before measuring
repeats: 3
slo:
  p99_ttft_ms: 500
  p99_itl_ms: 50
