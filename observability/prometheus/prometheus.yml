# Static config; targets come from file_sd files that Ansible writes per pool.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: attested

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

scrape_configs:
  - job_name: node
    file_sd_configs: [{files: ["/etc/prometheus/targets/node.json"]}]
  - job_name: dcgm
    scrape_interval: 5s          # XID / ECC detection latency feeds time-to-detect
    file_sd_configs: [{files: ["/etc/prometheus/targets/dcgm.json"]}]
  - job_name: slurm
    file_sd_configs: [{files: ["/etc/prometheus/targets/slurm.json"]}]
  - job_name: healthd
    file_sd_configs: [{files: ["/etc/prometheus/targets/healthd.json"]}]
  - job_name: vllm
    file_sd_configs: [{files: ["/etc/prometheus/targets/vllm.json"]}]
  - job_name: kueue
    scheme: https
    tls_config: {insecure_skip_verify: true}
    authorization:
      credentials_file: /etc/prometheus/secrets/kueue-token
    file_sd_configs: [{files: ["/etc/prometheus/targets/kueue.json"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
