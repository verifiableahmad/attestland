# vLLM serving (spec 3.2 / 4.2): OpenAI-compatible API, weights pulled from
# the durable bucket, readiness on /health, Service in front. MODEL_PREFIX selects the model.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-model
  namespace: serving
data:
  MODEL_PREFIX: models/al-gpt-124m-hf   # or models/<open 7-8B model>
  SERVED_NAME: al-gpt
  MAX_MODEL_LEN: "1024"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: serving
  labels:
    app: vllm
    kueue.x-k8s.io/queue-name: serving
    kueue.x-k8s.io/priority-class: serving
spec:
  replicas: 1
  strategy:
    type: Recreate      # one GPU: the old pod must release it first
  selector:
    matchLabels: {app: vllm}
  template:
    metadata:
      labels: {app: vllm}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        kueue.x-k8s.io/podset-unconstrained-topology: "true"   # single pod: no placement constraint (ADR 007)
    spec:
      priorityClassName: serving
      # Slurm-pool nodes carry fleet.attestland/pool=slurm:NoSchedule (pool-move),
      # which this pod deliberately does not tolerate.
      nodeSelector:
        fleet.attestland/pool: k8s
      initContainers:
        - name: fetch-weights
          image: amazon/aws-cli:2.27.50
          envFrom:
            - configMapRef: {name: vllm-model}
            - configMapRef: {name: s3-settings}
            - secretRef: {name: s3-credentials, optional: true}   # Nebius only (ADR 013)
          command: ["sh", "-c"]
          # Credentials on AWS: the node's instance role through IMDS (hop limit 2, infra/gpu-pool).
          # On failure it prints what it was given and whether DNS, the
          # endpoint and IMDS answer, so the pod's log says why (I-16;
          # `make serve-diag` on the control node runs the same checks).
          args:
            - |
              src="s3://${S3_BUCKET_PREFIX:+$S3_BUCKET_PREFIX-}$MODEL_PREFIX"
              aws s3 sync --delete "$src" /models/current && exit 0
              rc=$?
              echo "fetch-weights: sync of $src failed (rc $rc)"
              echo "  AWS_REGION=${AWS_REGION:-unset} S3_BUCKET_PREFIX=${S3_BUCKET_PREFIX:-unset} AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-unset}"
              host=${S3_BUCKET_PREFIX:+$S3_BUCKET_PREFIX-}${MODEL_PREFIX%%/*}.s3.${AWS_REGION:-us-east-1}.amazonaws.com
              if addr=$(getent hosts "$host"); then echo "  dns: $addr"; else echo "  dns: $host does not resolve (CoreDNS or the pod network)"; fi
              curl -sS -o /dev/null -m 5 -w '  https: HTTP %{http_code}\n' "https://$host/" 2>&1 | sed 's/^curl/  https: curl/'
              curl -sS -o /dev/null -m 3 -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' \
                -w '  imds: HTTP %{http_code}\n' http://169.254.169.254/latest/api/token 2>&1 || echo "  imds: no answer (hop limit, or not on AWS)"
              aws sts get-caller-identity --output text 2>&1 | sed 's/^/  identity: /'
              exit $rc
          volumeMounts:
            - {name: models, mountPath: /models}
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.11.0
          envFrom:
            - configMapRef: {name: vllm-model}
          args:
            - --model=/models/current
            - --served-model-name=$(SERVED_NAME)
            - --max-model-len=$(MAX_MODEL_LEN)
            - --gpu-memory-utilization=0.90
            - --disable-log-requests
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 300
            periodSeconds: 15
          # Sized to fit a g6.xlarge (4 vCPU, 14.9Gi allocatable) beside the
          # node's daemonsets; Kueue admits the pod only if one node holds it.
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: 14Gi
            requests:
              cpu: "3"
              memory: 12Gi
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: models
          hostPath: {path: /scratch/models, type: DirectoryOrCreate}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: serving
spec:
  type: NodePort
  selector: {app: vllm}
  ports:
    - {name: http, port: 8000, targetPort: http, nodePort: 30800}
