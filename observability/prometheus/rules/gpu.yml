groups:
  - name: gpu-health
    rules:
      - alert: GpuXidError
        expr: DCGM_FI_DEV_XID_ERRORS > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "XID {{ $value }} on {{ $labels.Hostname }} GPU {{ $labels.gpu }}"
      - alert: GpuDoubleBitEcc
        expr: increase(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL[5m]) > 0
        labels: {severity: critical}
        annotations:
          summary: "Uncorrectable ECC error on {{ $labels.Hostname }} GPU {{ $labels.gpu }}"
      - alert: GpuRowRemapFailure
        expr: DCGM_FI_DEV_ROW_REMAP_FAILURE > 0
        labels: {severity: critical}
        annotations:
          summary: "Row-remap failure on {{ $labels.Hostname }}: mark for repair"
      - alert: GpuThermalThrottle
        # bits: 8 = HW slowdown, 32 = SW thermal, 64 = HW thermal (PromQL has no bitwise AND)
        expr: >-
          (floor(DCGM_FI_DEV_CLOCKS_EVENT_REASONS / 8) % 2 == 1)
          or (floor(DCGM_FI_DEV_CLOCKS_EVENT_REASONS / 32) % 2 == 1)
          or (floor(DCGM_FI_DEV_CLOCKS_EVENT_REASONS / 64) % 2 == 1)
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Thermal or HW slowdown on {{ $labels.Hostname }} GPU {{ $labels.gpu }}"
      - alert: PeriodicDiagFailed
        expr: al_dcgm_diag_pass == 0
        labels: {severity: warning}
        annotations:
          summary: "dcgmi diag -r 1 failed on {{ $labels.instance }}"
  - name: fleet
    rules:
      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.instance }} is not responding"
      - alert: HealthdDrained
        expr: increase(healthd_drains_total[5m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "healthd drained a node (rule {{ $labels.rule }})"
      - alert: ScratchAlmostFull
        expr: node_filesystem_avail_bytes{mountpoint="/scratch"} / node_filesystem_size_bytes{mountpoint="/scratch"} < 0.05
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "/scratch on {{ $labels.instance }} is over 95% full: checkpoint saves will fail"
  - name: workloads
    rules:
      - alert: CheckpointSaveFailed
        expr: increase(al_ckpt_save_failures_total[10m]) > 0
        labels: {severity: critical}
        annotations:
          summary: "Checkpoint save failed on {{ $labels.instance }} (tier {{ $labels.tier }})"
      - alert: TrainingStalled
        expr: (time() - al_train_last_step_timestamp_seconds) > 300 and al_train_running == 1
        labels: {severity: warning}
        annotations:
          summary: "Training rank {{ $labels.rank }} on {{ $labels.instance }} made no progress for 5 min"
      - record: ac:train_tokens_per_second:sum
        expr: sum(rate(al_train_tokens_total[1m]))
      - record: ac:train_step_time_seconds:median
        expr: quantile(0.5, al_train_step_time_seconds)
      - alert: ServingSloBreach
        expr: histogram_quantile(0.99, sum by (le) (rate(vllm:time_to_first_token_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "p99 TTFT above 500 ms SLO"
