- name: DCGM (host engine, dcgmi diag)
  ansible.builtin.apt:
    name: "datacenter-gpu-manager-4-cuda{{ cuda_version.split('.')[0] }}={{ dcgm_version }}*"
    update_cache: true

- name: DCGM host engine
  ansible.builtin.systemd:
    name: nvidia-dcgm
    enabled: true
    state: started
  when: not (image_build | default(false))
