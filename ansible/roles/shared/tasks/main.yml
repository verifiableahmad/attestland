# Control node as the login node: this working tree (committed or not) at
# /opt/al/repo, the result files at /opt/al/results and the job logs and run
# progress under /scratch live here and are exported over NFS, so sbatch, the
# result parsers and `tail -f` all run on the control node. The GPU nodes mount
# them at the same paths (tasks/mount.yml); `make results-pull` copies results
# and logs to the laptop.
- name: rsync, venv support and the NFS server
  ansible.builtin.apt:
    name: [rsync, python3-venv, nfs-kernel-server]
    update_cache: true
    cache_valid_time: 3600

- name: Repo and results directories owned by the login user (jobs run as that user)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop: [/opt/al/repo, "{{ results_dir }}"]

- name: Job log and run directories (same mode as on the GPU nodes' scratch)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "1777"
  loop: ["{{ scratch_mount }}/logs", "{{ scratch_mount }}/runs"]

- name: Working tree and venv
  ansible.builtin.import_tasks: sync.yml

- name: Exports directory
  ansible.builtin.file:
    path: /etc/exports.d
    state: directory
    mode: "0755"

- name: Export the shared directories to the GPU nodes
  ansible.builtin.copy:
    dest: /etc/exports.d/al.exports
    mode: "0644"
    content: |
      {% for dir in shared_dirs %}
      {{ dir.path }} {{ groups['gpu'] | map('extract', hostvars, 'private_ip') | map('regex_replace', '$', '(' ~ dir.mode ~ ',sync,no_subtree_check)') | join(' ') }}
      {% endfor %}

- name: NFS server
  ansible.builtin.systemd:
    name: nfs-server
    enabled: true
    state: started

- name: Apply the exports
  ansible.builtin.command: exportfs -ra
  changed_when: false
