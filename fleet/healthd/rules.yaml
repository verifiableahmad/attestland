# healthd rules (spec 1.3). Every series a PromQL expr returns is a hit on its
# `node` label. `for` = consecutive evaluations (10 s apart) before acting.
rules:
  - name: xid79
    severity: critical
    expr: DCGM_FI_DEV_XID_ERRORS == 79
    for: 1
    action: drain_now
    description: GPU fell off the bus. Evict running pods.
  - name: xid48
    severity: critical
    expr: DCGM_FI_DEV_XID_ERRORS == 48
    for: 1
    action: drain_now
    description: Double-bit ECC error (XID 48).
  - name: ecc-dbe
    severity: critical
    expr: increase(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL[5m]) > 0
    for: 1
    action: drain_now
    description: Uncorrectable (double-bit) ECC error.
  - name: row-remap-failure
    severity: critical
    expr: DCGM_FI_DEV_ROW_REMAP_FAILURE > 0
    for: 1
    action: drain_now_repair
    description: Row remapping failed; the GPU needs repair.
  - name: epilog-xid-critical
    severity: critical
    type: event
    xids: [48, 79, 92, 94, 95]
    for: 1
    action: drain_now
    description: Slurm epilog saw a critical XID during the last job.
  - name: sbe-rate
    severity: warning
    expr: rate(DCGM_FI_DEV_ECC_SBE_VOL_TOTAL[10m]) * 3600 > 100
    for: 3
    action: drain_after_jobs
    description: Single-bit ECC rate above 100/h.
  - name: pcie-replay-rate
    severity: warning
    expr: rate(DCGM_FI_DEV_PCIE_REPLAY_COUNTER[10m]) * 60 > 10
    for: 3
    action: drain_after_jobs
    description: PCIe replays above 10/min.
  - name: periodic-diag-failed
    severity: warning
    # failed twice in a row: the diag runs every 30 min, so look at both of the last two results
    expr: max_over_time(al_dcgm_diag_pass[65m]) == 0 and count_over_time(al_dcgm_diag_last_run_timestamp_seconds[65m]) > 0
    for: 1
    action: drain_after_jobs
    description: dcgmi diag -r 1 failed on two consecutive runs.
  - name: straggler
    severity: warning
    type: straggler
    metric: al_train_step_time_seconds
    margin: 0.15        # 15% slower than the median rank
    window: 5m
    min_peers: 2
    for: 6              # one minute of consecutive evaluations
    action: drain_after_jobs
    description: Rank consistently slower than the median rank.
  # Network rules (from dc-orch, ADR 007). They watch secondary NICs: the GPU
  # "rail" NICs of multi-NIC machines. On EC2 the primary ENA NIC is often ens5,
  # which the pattern also matches; that is harmless, because the primary NIC
  # carries the scrape, so its loss shows up as a down node instead. On
  # single-NIC g6.2xlarge VMs these rules never fire.
  - name: rail-link-down
    severity: warning
    expr: node_network_up{device=~"ens([5-9]|[1-9][0-9])|eth[1-9][0-9]*"} == 0
    for: 2
    action: drain_after_jobs
    description: A rail (secondary) NIC is down; collectives on this node would fail or slow.
  - name: link-flapping
    severity: warning
    expr: increase(node_network_carrier_changes_total{device=~"ens[0-9]+|eth[0-9]+"}[10m]) > 4
    for: 1
    action: drain_after_jobs
    description: A NIC changed carrier state more than 4 times in 10 minutes.
