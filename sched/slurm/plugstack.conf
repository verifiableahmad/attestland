# Pyxis: srun --container-image=nvcr.io#nvidia/pytorch:<tag>
# GPU nodes: required, so a container that cannot start fails the step instead
# of running it on the host. runtime_path holds each job's squashfs
# (uncompressed, enroot.conf): the PyTorch image does not fit the /run tmpfs, so
# it goes on /scratch.
# Control node (the login node): optional. SPANK options are parsed where
# sbatch or srun runs, so without Pyxis here --container-image typed on the
# control node is an unknown option; the steps themselves run on the GPU nodes.
{% if 'gpu' in group_names %}
required /usr/local/lib/slurm/spank_pyxis.so runtime_path=/scratch/pyxis container_scope=job sbatch_support=1
{% else %}
optional /usr/local/lib/slurm/spank_pyxis.so runtime_path=/scratch/pyxis container_scope=job sbatch_support=1
{% endif %}
