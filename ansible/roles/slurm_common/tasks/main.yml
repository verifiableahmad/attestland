- name: Slurm user
  ansible.builtin.user:
    name: "{{ slurm_user }}"
    uid: "{{ slurm_uid }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Munge key (shared secret from AL_MUNGE_KEY_B64)
  ansible.builtin.copy:
    content: "{{ munge_key_b64 | b64decode }}"
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: "0400"
  no_log: true
  register: munge_key
  failed_when: munge_key_b64 | length == 0

- name: Munge running
  ansible.builtin.systemd:
    name: munge
    enabled: true
    state: "{{ 'restarted' if munge_key.changed else 'started' }}"

- name: Slurm directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ slurm_user }}"
    mode: "0755"
  loop: [/etc/slurm, /var/log/slurm, /var/spool/slurmd, /var/spool/slurmctld]

- name: JWT key (slurmrestd + healthd tokens)
  ansible.builtin.copy:
    content: "{{ slurm_jwt_key_b64 | b64decode }}"
    dest: /etc/slurm/jwt_hs256.key
    owner: "{{ slurm_user }}"
    mode: "0600"
  no_log: true

- name: Slurm configs
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../sched/slurm/{{ item.src }}"
    dest: "/etc/slurm/{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - {src: slurm.conf.j2, dest: slurm.conf}
    - {src: gres.conf, dest: gres.conf}
    - {src: cgroup.conf, dest: cgroup.conf}
    - {src: plugstack.conf, dest: plugstack.conf}
    - {src: prolog.sh, dest: prolog.sh, mode: "0755"}
    - {src: epilog.sh, dest: epilog.sh, mode: "0755"}
  register: slurm_conf

- name: systemd units from the Slurm build
  ansible.builtin.copy:
    src: "/usr/src/slurm-{{ slurm_version }}/etc/{{ item }}.service"
    dest: /etc/systemd/system/
    remote_src: true
    mode: "0644"
  loop: [slurmd, slurmctld, slurmdbd, slurmrestd]
