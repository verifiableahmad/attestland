# Cost control: hourly, delete project GPU instances older than 8 hours unless keep=true.
name: reaper
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List only"
        default: "1"
permissions:
  contents: read
  id-token: write
jobs:
  reap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        if: vars.AWS_REAPER_ROLE_ARN != ''
        with:
          role-to-assume: ${{ vars.AWS_REAPER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: azure/login@v2
        if: vars.AZURE_SUBSCRIPTION_ID != ''
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Reap
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: infra/reaper/reap.sh
