# SSH inside the pool (D-7), keys made here, never on the laptop:
#   al on the control node -> al on every GPU node: chaos/inject.sh and the
#     goodput experiment run `ssh <node> sudo ...` from the login node.
#   root on a GPU node -> root on the other GPU nodes: burn-in's mpirun and
#     iperf3 against the peer (fleet/burnin/burnin.sh).
# Each key is accepted only from the private addresses of the nodes that use it.
- name: Login user's key on the control node
  when: "'control' in group_names"
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: ssh-keygen -q -t ed25519 -N "" -C al@{{ inventory_hostname }} -f /home/{{ ansible_user }}/.ssh/id_ed25519
  args:
    creates: /home/{{ ansible_user }}/.ssh/id_ed25519

- name: Read the login user's public key
  run_once: true
  delegate_to: "{{ groups['control'][0] }}"
  ansible.builtin.slurp:
    src: /home/{{ ansible_user }}/.ssh/id_ed25519.pub
  register: al_login_pub

- name: Accept it on the GPU nodes, from the control node only
  when: "'gpu' in group_names"
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ al_login_pub.content | b64decode | trim }}"
    key_options: from="{{ control_private_ip }}"

# Burn-in: one root key shared by the GPU nodes (made on the first one).
- name: root's SSH directory
  when: "'gpu' in group_names"
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    mode: "0700"

- name: Burn-in key
  when: inventory_hostname == groups['gpu'][0]
  ansible.builtin.command: ssh-keygen -q -t ed25519 -N "" -C burnin@attestland -f /root/.ssh/id_ed25519
  args:
    creates: /root/.ssh/id_ed25519

- name: Read the burn-in key
  run_once: true
  delegate_to: "{{ groups['gpu'][0] }}"
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: [/root/.ssh/id_ed25519, /root/.ssh/id_ed25519.pub]
  register: al_burnin_key
  no_log: true

- name: Burn-in key on every GPU node
  when: "'gpu' in group_names"
  ansible.builtin.copy:
    content: "{{ item.content | b64decode }}"
    dest: "{{ item.source }}"
    mode: "{{ '0600' if item.source.endswith('id_ed25519') else '0644' }}"
  loop: "{{ al_burnin_key.results }}"
  loop_control:
    label: "{{ item.source }}"
  no_log: true

# Ubuntu allows root logins by key (PermitRootLogin prohibit-password); the
# cloud image's own root entry stays as it is.
- name: Accept the burn-in key for root, from the GPU nodes only
  when: "'gpu' in group_names"
  ansible.posix.authorized_key:
    user: root
    key: "{{ (al_burnin_key.results | selectattr('source', 'search', 'pub$') | first).content | b64decode | trim }}"
    key_options: from="{{ groups['gpu'] | map('extract', hostvars, 'private_ip') | join(',') }}"
