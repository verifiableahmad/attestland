# Expose Kueue controller metrics to the host Prometheus on NodePort 30443.
apiVersion: v1
kind: Service
metadata:
  name: kueue-metrics-nodeport
  namespace: kueue-system
spec:
  type: NodePort
  selector:
    control-plane: controller-manager
  ports:
    - {name: https, port: 8443, targetPort: 8443, nodePort: 30443}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-scraper
  namespace: kueue-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-scraper-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kueue-metrics-reader
subjects:
  - kind: ServiceAccount
    name: prometheus-scraper
    namespace: kueue-system
