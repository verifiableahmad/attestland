# Durable tier settings (ADR 010): an env file the training scripts source.
# Buckets are created by tofu (infra/gpu-pool/storage.tf); credentials come from
# the node's instance role, so the file holds no secret. On Nebius (ADR 013) it
# also holds the endpoint and the S3 key (ckpt.py reads AL_S3_*), readable only
# by root and the job user.
- name: Fleet config directory
  ansible.builtin.file:
    path: /etc/fleet
    state: directory
    mode: "0755"

- name: S3 environment for jobs
  ansible.builtin.copy:
    dest: /etc/fleet/s3.env
    group: "{{ ansible_user if s3_endpoint_url else 'root' }}"
    mode: "{{ '0640' if s3_endpoint_url else '0644' }}"
    content: |
      AL_S3_REGION={{ s3_region }}
      AL_BUCKET_PREFIX={{ s3_bucket_prefix }}
      {% if s3_endpoint_url %}
      AL_S3_ENDPOINT={{ s3_endpoint_url }}
      AL_S3_ACCESS_KEY={{ s3_access_key }}
      AL_S3_SECRET_KEY={{ s3_secret_key }}
      {% endif %}
  no_log: "{{ s3_endpoint_url != '' }}"
