# The pinned release, by checksum: not get-helm-3 from Helm's main branch, which
# installs whatever is newest (D-6, SEC-5).
- name: Helm release (checksum in versions.env)
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: "/opt/al/dl/helm-{{ helm_version }}-linux-amd64.tar.gz"
    checksum: "sha256:{{ helm_sha256 }}"
    mode: "0644"

- name: Helm
  ansible.builtin.shell: |
    set -euo pipefail
    /usr/local/bin/helm version --short 2>/dev/null | grep -q '^{{ helm_version }}+' && { echo present; exit 0; }
    tar -xzf /opt/al/dl/helm-{{ helm_version }}-linux-amd64.tar.gz -C /tmp linux-amd64/helm
    install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
    rm -rf /tmp/linux-amd64
  args:
    executable: /bin/bash
  register: al_helm
  changed_when: "'present' not in al_helm.stdout"

- name: Copy cluster manifests
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../sched/k8s/"
    dest: /opt/al/k8s/

- name: GPU Operator
  ansible.builtin.shell: |
    helm repo add nvidia https://helm.ngc.nvidia.com/nvidia --force-update
    helm upgrade --install gpu-operator nvidia/gpu-operator --version {{ gpu_operator_version }} \
      -n gpu-operator --create-namespace -f /opt/al/k8s/gpu-operator-values.yaml --wait --timeout 15m
  changed_when: true

- name: Kueue install directory
  ansible.builtin.file:
    path: /opt/al/k8s/kueue-install
    state: directory
    mode: "0755"

- name: Kueue release manifest (checksum in versions.env)
  ansible.builtin.get_url:
    url: https://github.com/kubernetes-sigs/kueue/releases/download/{{ kueue_version }}/manifests.yaml
    dest: /opt/al/k8s/kueue-install/manifests.yaml
    checksum: "sha256:{{ kueue_manifest_sha256 }}"
    mode: "0644"

- name: Kueue kustomization, manager config and patch
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/opt/al/k8s/kueue-install/{{ item.dest }}"
    mode: "0644"
  loop:
    - {src: kueue-kustomization.yaml, dest: kustomization.yaml}
    - {src: "{{ playbook_dir }}/../sched/k8s/kueue/manager-config.yaml", dest: manager-config.yaml}

- name: Kueue manager patch
  ansible.builtin.template:
    src: kueue-manager-patch.yaml.j2
    dest: /opt/al/k8s/kueue-install/manager-patch.yaml
    mode: "0644"

# One server-side apply of the kustomized release. The manager restarts only if
# its pod template changed (a new release, config or patch): during a restart
# the webhook is down, so the CRs below are retried.
- name: Kueue
  ansible.builtin.shell: |
    set -euo pipefail
    out=$(kubectl apply --server-side --force-conflicts -k /opt/al/k8s/kueue-install)
    echo "$out" | grep -v ' serverside-applied$' || true
    kubectl -n kueue-system rollout status deploy/kueue-controller-manager --timeout=5m
    kubectl apply -f /opt/al/k8s/kueue/namespaces.yaml
    # Topology before the flavor that names it; apiVersion = the storage version of the CRD (ADR 007)
    topo_api=$(kubectl get crd topologies.kueue.x-k8s.io -o jsonpath='{.spec.versions[?(@.storage==true)].name}')
    # The webhook Service refuses connections for a few seconds after a rollout: retry for a minute.
    for try in $(seq 12); do
      if sed "s|^apiVersion: kueue.x-k8s.io/.*|apiVersion: kueue.x-k8s.io/${topo_api}|" /opt/al/k8s/kueue/topology.yaml | kubectl apply -f - \
          && kubectl apply -f /opt/al/k8s/kueue/flavors-and-queues.yaml; then break; fi
      [ "$try" -lt 12 ]
      sleep 5
    done
  args:
    executable: /bin/bash
  changed_when: true

- name: Durable bucket settings for serving (AWS credentials come from the node role via IMDS)
  ansible.builtin.shell: |
    kubectl -n serving create configmap s3-settings \
      --from-literal=AWS_REGION={{ s3_region }} \
      --from-literal=S3_BUCKET_PREFIX={{ s3_bucket_prefix }} \
      {% if s3_endpoint_url %}--from-literal=AWS_ENDPOINT_URL={{ s3_endpoint_url }} {% endif %}\
      --dry-run=client -o yaml | kubectl apply -f -
  changed_when: true

- name: S3 key for serving (Nebius, ADR 013; no instance role there)
  ansible.builtin.shell: |
    kubectl -n serving create secret generic s3-credentials \
      --from-literal=AWS_ACCESS_KEY_ID={{ s3_access_key | quote }} \
      --from-literal=AWS_SECRET_ACCESS_KEY={{ s3_secret_key | quote }} \
      --dry-run=client -o yaml | kubectl apply -f -
  when: s3_endpoint_url | length > 0
  no_log: true
  changed_when: true

- name: vLLM
  ansible.builtin.command: kubectl apply -f /opt/al/k8s/vllm/vllm.yaml
  changed_when: true

# Readable only by Prometheus (uid 65534 in its image), and short-lived: a pool
# lives hours, and `make configure` mints a new one (SEC-4).
- name: Kueue metrics for Prometheus
  ansible.builtin.shell: |
    set -euo pipefail
    mkdir -p /etc/prometheus/secrets
    kubectl apply -f /opt/al/k8s/kueue/metrics.yaml
    umask 077
    kubectl -n kueue-system create token prometheus-scraper --duration=168h > /etc/prometheus/secrets/kueue-token.new
    chown 65534:65534 /etc/prometheus/secrets/kueue-token.new
    chmod 0400 /etc/prometheus/secrets/kueue-token.new
    mv /etc/prometheus/secrets/kueue-token.new /etc/prometheus/secrets/kueue-token
  args:
    executable: /bin/bash
  changed_when: true
